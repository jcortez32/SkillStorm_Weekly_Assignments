[project]
name = "support_api"
version = "0.1.0"
description = "validates a warehouse's restock manifest"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3"
]

[project.optional-dependencies]
test = [
    "pytest >= 8.0",
    "pytest-asyncio>=0.23"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["support_api*"]