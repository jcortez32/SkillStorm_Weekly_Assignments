[project]
name = "ticket-assistant"
version = "0.1.0"
description = "LangGraph Agent"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "langchain-core>=1.6",
    "langchain-aws>=1.7",
    "python-dotenv>=1.0",
    "langgraph>=1.2",
    # dependency for chunking the local runbooks for RAG - external Knowledge Base wouldn't need.
    "langchain-text-splitters>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ticket_assistant*"]
